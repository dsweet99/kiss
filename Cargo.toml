[package]
name = "kiss-ai"
version = "0.4.13"
edition = "2024"
description = "Global code feedback for LLM coding agents"
license = "MIT"
repository = "https://github.com/dsweet99/kiss"
readme = "README.md"
keywords = ["code-quality", "metrics", "linting", "python", "rust"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "images/**",
    "pytest.ini",
    "src/**",
    "tests/**",
    "!.pytest_cache/**",
    "!tests/**/__pycache__/**",
    "!tests/**/*.pyc",
    "!tests/**/target/**",
]

[[bin]]
name = "kiss"
path = "src/main.rs"

[lib]
name = "kiss"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Cache serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep SIGPIPE ignored so internal pipe writes (forkserver stdin) return EPIPE instead of killing kiss
libc = "0.2"
fs2 = "0.4"

# Parallel iteration
rayon = "1.10"

# File traversal with gitignore support
ignore = "0.4"

# Python parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"

# Rust parsing
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Graph algorithms for dependency analysis
petgraph = "0.7"

# Configuration file parsing
toml = { version = "1", features = ["preserve_order"] }
fa-leiden-cd = "0.1.0"
bincode = "1.3"
cargo-config2 = "0.1.44"
notify = "6.1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[profile.test]
# Faster test builds + smaller binaries so OS-process / CLI spawn tests stay under 2s.
opt-level = 1
codegen-units = 256
debug = 0
strip = "debuginfo"

# codegen-units applies to kiss-ai only. Set on [profile.dev], it also applies
# to dependencies.
[profile.dev]
incremental = true
debug = "line-tables-only"
lto = "off"

[profile.release]
lto = "off"

[profile.dev.package."kiss-ai"]
codegen-units = 3

# Backtraces lose line numbers inside dependencies; dev builds are about 14% faster.
[profile.dev.package."*"]
debug = false

# Local optimized builds: `cargo build --profile release-local`. Shipped builds
# (`cargo install kiss-ai`) use [profile.release] unchanged.
[profile.release-local]
inherits = "release"
incremental = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
