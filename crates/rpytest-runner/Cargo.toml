[package]
name = "rpytest-runner"
version = "0.1.0"
edition = "2024"
description = "Small pytest execution boundary for Kiss and rslip"
license = "MIT"
repository = "https://github.com/dsweet99/kiss"
readme = "../../README.md"
keywords = ["pytest", "testing", "runner", "python", "kiss"]
categories = ["development-tools::testing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3"
